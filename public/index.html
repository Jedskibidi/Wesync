<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wesync</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-head">
        <h1>Wesync</h1>
        <p class="status">Status: <span id="status">connecting...</span></p>
      </header>

      <p id="message" class="message"></p>

      <!-- First screen: start or join a listening room -->
      <section id="roomSection" class="card room">
        <h2>Listen together</h2>
        <p id="inviteHint" class="room-info" hidden></p>

        <div>
          <label class="label" for="nickname">Your nickname</label>
          <input
            id="nickname"
            class="input"
            maxlength="20"
            autocomplete="off"
            aria-describedby="nicknameError"
          />
          <p id="nicknameError" class="error-text" role="alert" hidden></p>
        </div>

        <button id="create" class="btn btn-primary" type="button">
          Create Room
        </button>

        <p class="room-info">or join a friend's room</p>

        <div>
          <label class="label" for="code">Room code</label>
          <div class="field-row">
            <input
              id="code"
              class="input code-input"
              maxlength="4"
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
              aria-describedby="codeError"
            />
            <button id="join" class="btn btn-secondary" type="button">
              Join Room
            </button>
          </div>
          <p id="codeError" class="error-text" role="alert" hidden></p>
        </div>
      </section>

      <!-- Shown after you are in a room -->
      <section id="roomInfo" class="card room" hidden>
        <p class="room-info">Room: <b id="room">none</b></p>
        <p class="room-info">Members: <span id="members">-</span></p>
      </section>

      <section id="player" hidden>
        <select id="songSelect"></select>
        <button id="setSong">Set song</button>
        <button id="addToQueue">Add to queue</button>

        <audio id="audio" preload="auto"></audio>

        <div>
          <button id="previous">Previous</button>
          <button id="play">Play</button>
          <button id="pause">Pause</button>
          <button id="next">Next</button>
        </div>

        <div>
          <span id="currentTime">0:00</span>
          <input id="seek" type="range" min="0" max="0" step="0.1" value="0" />
          <span id="duration">0:00</span>
        </div>

        <div>
          Volume
          <input
            id="volume"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="1"
          />
        </div>

        <h3>Up next</h3>
        <ul id="queueList"></ul>
      </section>
    </main>

    <div id="joinOverlay" hidden>
      <p>Music is already playing in this room.</p>
      <button id="joinListening">Tap to join the listening</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
  </body>
</html>
