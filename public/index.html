<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wesync</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-head">
        <span class="spr spr-bee" role="img" aria-label="Bee"></span>
        <h1>Wesync</h1>
        <p class="status">Status: <span id="status">connecting...</span></p>
      </header>

      <p id="message" class="message" role="status"></p>

      <section id="roomSection" class="room card" aria-label="Room">
        <div class="field-row">
          <input id="nickname" class="input" placeholder="Nickname" />
          <button id="create" class="btn">Create Room</button>
          <input
            id="code"
            class="input code-input"
            placeholder="Room code"
            maxlength="4"
          />
          <button id="join" class="btn btn-secondary">Join Room</button>
        </div>
        <p class="room-info">
          Room: <b id="room">none</b> &nbsp;|&nbsp; Members:
          <span id="members">-</span>
        </p>
      </section>

      <div class="layout">
        <!-- Left: the player -->
        <section id="player" class="deck card" aria-label="Player">
          <div class="lcd">
            <span id="lcdTrack">INSERT DISC</span>
            <span id="lcdTime">00:00</span>
          </div>

          <div class="deck-controls">
            <button
              id="previous"
              class="btn btn-icon"
              aria-label="Previous song"
              disabled
            >
              &#9664;&#9664;
            </button>
            <button
              id="playPause"
              class="btn btn-icon is-play"
              aria-label="Play"
              disabled
            >
              &#9654;
            </button>
            <button
              id="next"
              class="btn btn-icon"
              aria-label="Next song"
              disabled
            >
              &#9654;&#9654;
            </button>
          </div>

          <div class="deck-progress">
            <input
              id="seek"
              class="slider"
              type="range"
              min="0"
              max="0"
              step="0.1"
              value="0"
              aria-label="Seek"
              disabled
            />
            <div class="deck-times">
              <span id="currentTime">0:00</span>
              <span id="duration">0:00</span>
            </div>
          </div>

          <div class="deck-volume">
            <button id="mute" class="btn btn-secondary btn-sm">Mute</button>
            <input
              id="volume"
              class="slider"
              type="range"
              min="0"
              max="1"
              step="0.01"
              value="1"
              aria-label="Volume"
            />
          </div>

          <audio id="audio" preload="auto"></audio>
        </section>

        <!-- Right: playlist (with upload) and the room queue -->
        <div class="col">
          <section class="card playlist-card" aria-label="Playlist">
            <div class="list-head">
              <h2>Playlist</h2>
              <button id="addBtn" class="btn btn-sm">Add songs</button>
            </div>

            <div id="dropZone" class="drop" tabindex="0" role="button">
              Drag .mp3 files here or click to choose
            </div>
            <p
              id="uploadStatus"
              class="upload-status"
              role="status"
              aria-live="polite"
            ></p>
            <input
              id="songFile"
              type="file"
              accept=".mp3,audio/mpeg"
              multiple
              hidden
            />

            <ul id="playlist" class="track-list"></ul>
          </section>

          <section class="card" aria-label="Queue">
            <h3>Up next</h3>
            <ul id="queueList" class="track-list queue"></ul>
          </section>
        </div>
      </div>
    </main>

    <div id="joinOverlay" class="overlay" hidden>
      <div class="card">
        <p>Music is already playing in this room.</p>
        <button id="joinListening" class="btn">
          Tap to join the listening
        </button>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
  </body>
</html>
