<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wesync</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-head">
        <span class="spr spr-bee" role="img" aria-label="Bee"></span>
        <h1>Wesync</h1>
        <p class="status">Status: <span id="status">connecting...</span></p>
      </header>

      <p id="message" class="message" role="status"></p>

      <!-- First screen: start or join a listening room -->
      <section id="roomSection" class="room card" aria-label="Room">
        <p id="inviteHint" class="room-info" hidden></p>

        <div>
          <label class="label" for="nickname">Your nickname</label>
          <input
            id="nickname"
            class="input"
            placeholder="Nickname"
            maxlength="20"
            autocomplete="off"
            aria-describedby="nicknameError"
          />
          <p id="nicknameError" class="error-text" role="alert" hidden></p>
        </div>

        <div class="field-row">
          <button id="create" class="btn" type="button">Create Room</button>
          <span class="room-info">or join a friend's room:</span>
        </div>

        <div>
          <label class="label" for="code">Room code</label>
          <div class="field-row">
            <input
              id="code"
              class="input code-input"
              placeholder="Room code"
              maxlength="4"
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
              aria-describedby="codeError"
            />
            <button id="join" class="btn btn-secondary" type="button">
              Join Room
            </button>
          </div>
          <p id="codeError" class="error-text" role="alert" hidden></p>
        </div>

        <!-- Only shown when the room asks for a password (app.js) -->
        <div id="passwordRow" hidden>
          <label class="label" for="roomPassword">Room password</label>
          <input
            id="roomPassword"
            class="input"
            type="password"
            placeholder="Password"
            autocomplete="off"
            aria-describedby="roomPasswordError"
          />
          <p id="roomPasswordError" class="error-text" role="alert" hidden></p>
        </div>
      </section>

      <!-- Shown after you are in a room (roominfo.js adds the member count,
           "Copy invite link" and "Leave room" to this card) -->
      <section id="roomInfo" class="room card" aria-label="Room info" hidden>
        <p class="room-info">Room: <b id="room">none</b></p>

        <!-- Who is in the room (filled in by showMembers() in app.js) -->
        <div id="memberPanel" class="member-panel" aria-label="Members">
          <div class="member-head">
            <h3>Members</h3>
            <span id="memberCount" class="member-count">0</span>
          </div>
          <ul id="memberList" class="member-list"></ul>
        </div>
      </section>

      <div class="layout">
        <!-- Left: the player -->
        <section id="player" class="deck card" aria-label="Player">
          <div class="lcd">
            <span id="lcdTrack">INSERT DISC</span>
            <span id="lcdTime">00:00</span>
          </div>

          <!-- Now playing: song title, cover art placeholder, "Picked by" -->
          <div class="now-playing">
            <div class="np-art" role="img" aria-label="Cover art placeholder"></div>
            <div class="np-text">
              <p id="npTitle" class="np-title" aria-live="polite">
                Nothing playing
              </p>
              <p id="npPicker" class="np-picker" hidden></p>
            </div>
          </div>

          <div class="deck-controls">
            <button
              id="previous"
              class="btn btn-icon"
              aria-label="Previous song"
              disabled
            >
              &#9664;&#9664;
            </button>
            <button
              id="playPause"
              class="btn btn-icon is-play"
              aria-label="Play"
              disabled
            >
              &#9654;
            </button>
            <button
              id="next"
              class="btn btn-icon"
              aria-label="Next song"
              disabled
            >
              &#9654;&#9654;
            </button>
          </div>

          <div class="deck-progress">
            <input
              id="seek"
              class="slider"
              type="range"
              min="0"
              max="0"
              step="0.1"
              value="0"
              aria-label="Seek"
              disabled
            />
            <div class="deck-times">
              <span id="currentTime">0:00</span>
              <span id="duration">0:00</span>
            </div>
          </div>

          <div class="deck-volume">
            <button id="mute" class="btn btn-secondary btn-sm">Mute</button>
            <input
              id="volume"
              class="slider"
              type="range"
              min="0"
              max="1"
              step="0.05"
              value="1"
              aria-label="Volume"
            />
          </div>

          <audio id="audio" preload="auto"></audio>
        </section>

        <!-- Right: playlist (with upload) and the room queue -->
        <div class="col">
          <section class="card playlist-card" aria-label="Playlist">
            <div class="list-head">
              <h2>Playlist</h2>
              <button id="addBtn" class="btn btn-sm">Add songs</button>
            </div>

            <div id="dropZone" class="drop" tabindex="0" role="button">
              Drag .mp3 files here or click to choose
            </div>
            <p
              id="uploadStatus"
              class="upload-status"
              role="status"
              aria-live="polite"
            ></p>
            <input
              id="songFile"
              type="file"
              aria-label="Choose MP3 files to upload"
              accept=".mp3,audio/mpeg"
              multiple
              hidden
            />

            <div class="search-row">
              <input
                id="songSearch"
                class="input"
                type="search"
                placeholder="Search songs"
                autocomplete="off"
                aria-label="Search songs"
              />
            </div>

            <ul id="playlist" class="track-list"></ul>
          </section>

          <section class="card" aria-label="Queue">
            <h3>Up next</h3>
            <ul id="queueList" class="track-list queue"></ul>
          </section>
        </div>
      </div>
    </main>

    <div id="joinOverlay" class="overlay" hidden>
      <div
        class="card overlay-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="overlayTitle"
      >
        <span class="spr spr-bee overlay-bee" role="img" aria-label="Bee"></span>
        <h2 id="overlayTitle">Join the listening</h2>
        <p>Music is already playing in this room.</p>
        <button id="joinListening" class="btn">
          Tap to join the listening
        </button>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
  </body>
</html>
